[project]
name = "password-manager"
version = "0.1.0"
description = "Менеджер паролей в консоли с использованием Argon2id и Fernet"
readme = "README.md"
authors = [
    { name = "daysonee", email = "egorkarpunin08@gmail.com" }
]
requires-python = ">=3.12"
dependencies = ["cryptography>=44"]

[project.scripts]
pm = "password_manager.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"


[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"